name: Exchange rates

# Also rebuilds the quick-search index (assets/data/search.json) from the database.

# Daily at 17:30 UTC (about 4:30am Melbourne), after the ECB publishes (around 16:00 CET on working days).
on:
  schedule:
    - cron: '30 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exchange-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Pinned to exact commits (security check, 31 Oct 2026): a tag like @v4 can be moved by whoever controls the
      # action, and this job holds the Cloudflare token and can push. Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Fetch rates, store in D1, rewrite fx.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python .github/scripts/update_fx.py
      - name: Rebuild the quick-search index from the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python .github/scripts/build_search.py
      - name: Commit the data files if they changed
        run: |
          git config user.name  "poofbooks-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- assets/data/fx.json; then
            git add assets/data/fx.json
            git commit -m "Exchange rates: ECB $(python -c "import json;print(json.load(open('assets/data/fx.json'))['date'])")"
          fi
          if ! git diff --quiet -- assets/data/search.json; then
            git add assets/data/search.json
            git commit -m "Search index: rebuilt from the database"
          fi
          git push
