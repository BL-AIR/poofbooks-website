<style>

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--cream); font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh; }
  main { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 56px 24px 48px; }
  .logo { display: block; width: min(420px, 80vw); height: auto; }
  .card { margin-top: 44px; width: min(560px, 100%); padding: 36px 32px 34px; background: #1F1736; border: 1px solid #3A2F57; border-radius: 18px; }
  .icon { display: block; width: 56px; height: 56px; margin: 0 auto 18px; }
  .eyebrow { margin: 0 auto; font-weight: 800; font-size: 13px; letter-spacing: 0.3em; padding-left: 0.3em; color: var(--lilac); }
  h1 { margin: 12px 0 0; font-weight: 800; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; color: var(--pink); }
  p { margin: 16px auto 0; max-width: 32em; font-size: 16px; line-height: 1.6; color: var(--muted); }
  p.small { font-size: 14px; color: #A79DC6; }
  strong { color: var(--cream); font-weight: 600; }
  .button { display: inline-block; margin-top: 26px; padding: 12px 22px; font-weight: 800; font-size: 16px; color: var(--night); background: var(--pink); border-radius: 10px; text-decoration: none; }
  .button:hover { background: var(--lilac); }
  .button:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
  footer { padding: 24px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px 28px; justify-content: center; font-size: 14px; color: var(--muted); }
  footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  footer a:hover { color: var(--pink); }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: appear 700ms 150ms cubic-bezier(.2,.7,.2,1) both; }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
